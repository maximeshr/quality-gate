# Runs every quality gate and posts (or updates) one report comment on the pull request.
# Call it from a project: uses: maximeshr/quality-gate/.github/workflows/reusable-report.yml@<tag>
name: Quality report

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for the gates.
        type: string
        default: "26"
      setup:
        description: Command run before the gates, e.g. `vp run astro sync` to generate the types `vp check` needs.
        type: string
        default: ""

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history: the report lists the coverage of the files changed since the base branch.
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: true
      - run: vp install --frozen-lockfile
      - name: Install Semgrep
        run: pipx install semgrep==1.181.0
      - name: Resolve the quality-gate CLI
        run: |
          if [ "$(jq -r .name package.json)" = "quality-gate" ]; then echo "QG=node bin/quality-gate.js" >> "$GITHUB_ENV"; else echo "QG=vp exec quality-gate" >> "$GITHUB_ENV"; fi
      # The base branch's coverage, saved by its last push run: the report shows the change and
      # fails when line coverage drops. Outside the workspace, so no gate checks the file.
      - name: Restore the base branch coverage
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/quality-gate-baseline
          key: quality-gate-coverage-${{ github.base_ref }}-${{ github.event.pull_request.base.sha }}
          restore-keys: quality-gate-coverage-${{ github.base_ref }}-
      - name: Run the quality gates
        id: gates
        continue-on-error: true
        env:
          SETUP: ${{ inputs.setup }}
          BASE_REF: ${{ github.base_ref }}
          BASELINE: ${{ runner.temp }}/quality-gate-baseline/coverage-summary.json
        run: |
          set -- quality-report.md
          if [ -n "$SETUP" ]; then set -- "$@" --setup "$SETUP"; fi
          if [ -n "$BASE_REF" ]; then set -- "$@" --base "origin/$BASE_REF"; fi
          if [ -f "$BASELINE" ]; then set -- "$@" --baseline "$BASELINE"; fi
          $QG report "$@"
      - name: Keep the coverage for the pull requests into this branch
        id: coverage
        if: github.event_name == 'push' && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          mkdir -p "$RUNNER_TEMP/quality-gate-baseline"
          cp coverage/coverage-summary.json "$RUNNER_TEMP/quality-gate-baseline/"
      - name: Save the coverage of this branch
        if: steps.coverage.outcome == 'success'
        # A rerun on the same commit finds the key taken: nothing to save.
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/quality-gate-baseline
          key: quality-gate-coverage-${{ github.ref_name }}-${{ github.sha }}
      - name: Job summary
        if: always()
        run: cat quality-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post or update the pull request comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- quality-gate-report -->")) | .id' | head -n1)
          body=$(jq -Rs '{body: .}' quality-report.md)
          if [ -n "$id" ]; then
            echo "$body" | gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" --input - >/dev/null
          else
            echo "$body" | gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --input - >/dev/null
          fi
      - name: Fail if a gate failed
        if: steps.gates.outcome == 'failure'
        run: exit 1
