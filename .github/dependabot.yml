version: 2
updates:
  - package-ecosystem: npm # pnpm
    directory: /
    target-branch: canary
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Same rule as minimumReleaseAge in pnpm-workspace.yaml. Security updates are not delayed.
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The @types/node major follows the engines.node minimum (22), not the dev runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # vite-plus pins its vite core and vitest: bump them together.
      vite-plus:
        patterns: ["vite-plus", "vite", "vitest", "@vitest/*", "@voidzero-dev/*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: canary
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
